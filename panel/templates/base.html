<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Evo{% endblock %}</title>
<script>
  // 主题：记住上次的选择；没选过就跟随系统的深浅色
  (function () {
    var theme = null;
    try { theme = localStorage.getItem("evo-theme"); } catch (e) {}
    if (theme !== "light" && theme !== "dark") {
      theme = window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
    }
    document.documentElement.dataset.theme = theme;
  })();
</script>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<div class="wrap">

<header class="top">
  <div class="brand">
    <svg width="28" height="28" viewBox="0 0 28 28" aria-hidden="true">
      <path d="M14 2 L25 7 L25 15 C25 21 20 25 14 27 C8 25 3 21 3 15 L3 7 Z" fill="none" stroke="currentColor" stroke-width="2"></path>
      <path d="M14 8 L20 10.5 L20 15 C20 18.5 17.5 20.5 14 21.5 C10.5 20.5 8 18.5 8 15 L8 10.5 Z" fill="currentColor"></path>
    </svg>
    <span class="brand-name">EVO</span>
  </div>
  <nav class="nav" aria-label="主导航">
    <span class="disabled" title="即将推出">总览</span>
    <a href="{{ url_for('matches') }}" class="{{ 'active' if request.endpoint == 'matches' }}">战绩</a>
    <span class="disabled" title="即将推出">设置</span>
  </nav>
  {% if is_demo %}
  <div class="pill pill-warn" title="当前读取的是 {{ db_name }}，不是正式数据库">
    <span class="dot"></span><span>演示数据</span>
  </div>
  {% endif %}
  <button type="button" class="icon-btn" id="theme-toggle" aria-label="切换白天/黑夜">
    <svg class="icon-sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="4"></circle><path d="M12 2 L12 4"></path><path d="M12 20 L12 22"></path><path d="M2 12 L4 12"></path><path d="M20 12 L22 12"></path><path d="M4.9 4.9 L6.3 6.3"></path><path d="M17.7 17.7 L19.1 19.1"></path><path d="M4.9 19.1 L6.3 17.7"></path><path d="M17.7 6.3 L19.1 4.9"></path></svg>
    <svg class="icon-moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M20 14.5 A8 8 0 1 1 9.5 4 A6.5 6.5 0 0 0 20 14.5 Z"></path></svg>
  </button>
</header>

{% for category, message in get_flashed_messages(with_categories=true) %}
<div class="flash flash-{{ category }}" role="status">{{ message }}</div>
{% endfor %}

{% block content %}{% endblock %}

</div>
<script>
  document.getElementById("theme-toggle").addEventListener("click", function () {
    var next = document.documentElement.dataset.theme === "dark" ? "light" : "dark";
    document.documentElement.dataset.theme = next;
    try { localStorage.setItem("evo-theme", next); } catch (e) {}
  });
</script>
{% block scripts %}{% endblock %}
</body>
</html>
